<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#fff7f9;color:#482b38;font-family:system-ui,sans-serif;line-height:1.7}
    main{max-width:500px;margin:auto;padding:32px 24px;background:white;border:1px solid #f0d5e0;border-radius:20px;text-align:center}
    h1{font-size:23px;margin:0 0 12px}p{color:#755366}input{width:100%;margin:24px 0;font:inherit}button{width:100%;min-height:50px;border:0;border-radius:25px;background:#d98085;color:white;font:600 17px system-ui;cursor:pointer}button:disabled{background:#eee;color:#999;cursor:default}
    #status{white-space:pre-line;overflow-wrap:anywhere;font-size:14px}small{display:block;color:#755366}button:focus-visible,input:focus-visible{outline:2px solid #ad456e;outline-offset:4px}
  </style>
</head>
<body>
<main>
  <h1>하객 사진 업로드</h1>
  <p>소중한 순간을 함께 나눠주세요 ♡</p>
  <label for="photos">사진 선택하기</label>
  <input id="photos" type="file" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" multiple>
  <small>한 번에 최대 10장 · 한 장당 10MB · JPG, PNG, HEIC</small>
  <button id="upload" type="button" disabled>사진 업로드하기</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const photos = document.getElementById('photos');
  const button = document.getElementById('upload');
  const status = document.getElementById('status');
  let queue = [];
  photos.addEventListener('change', () => {
    queue = Array.from(photos.files);
    const valid = queue.length > 0 && queue.length <= 10 && queue.every(f => f.size > 0 && f.size <= 10 * 1024 * 1024);
    button.disabled = !valid;
    status.textContent = valid ? queue.length + '장을 선택했습니다.' : '사진을 최대 10장, 한 장당 10MB 이하로 선택해 주세요.';
  });
  const readPhoto = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ base64: String(reader.result).split(',')[1] });
    reader.onerror = () => reject(new Error('사진을 읽지 못했습니다. 다시 선택해 주세요.'));
    reader.readAsDataURL(file);
  });
  const send = payload => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadPhoto(payload);
  });
  button.addEventListener('click', async () => {
    if (button.disabled) return;
    button.disabled = true;
    photos.disabled = true;
    let sent = 0;
    const total = queue.length;
    try {
      while (queue.length) {
        status.textContent = (sent + 1) + ' / ' + total + '장 업로드 중…';
        await send(await readPhoto(queue[0]));
        queue.shift();
        sent++;
      }
      photos.value = '';
      status.textContent = total + '장 업로드 완료! 감사합니다 ♡';
    } catch (error) {
      status.textContent = sent + '장 업로드 완료. ' + (error.message || '업로드에 실패했습니다.') + '\n남은 사진은 다시 업로드할 수 있습니다.';
    } finally {
      photos.disabled = false;
      button.disabled = queue.length === 0;
    }
  });
</script>
</body>
</html>
