<!doctype html>
<html lang="<?= lang ?>">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#fff7f9;color:#482b38;font-family:system-ui,sans-serif;line-height:1.7}
    main{max-width:500px;margin:auto;padding:32px 24px;background:white;border:1px solid #f0d5e0;border-radius:20px;text-align:center}
    h1{font-size:23px;margin:0 0 12px}p{color:#755366}button{width:100%;min-height:50px;border:0;border-radius:25px;background:#d98085;color:white;font:600 17px system-ui;cursor:pointer}button:disabled{background:#eee;color:#999;cursor:default}
    .file-picker{display:block;margin:24px 0 8px;padding:12px;border:1px dashed #d98085;border-radius:12px;cursor:pointer}#selection{margin:0 0 16px;font-size:14px}
    .file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.file-picker:has(:focus-visible){outline:2px solid #ad456e;outline-offset:4px}
    #status{white-space:pre-line;overflow-wrap:anywhere;font-size:14px}small{display:block;color:#755366;margin-bottom:20px}button:focus-visible{outline:2px solid #ad456e;outline-offset:4px}
  </style>
</head>
<body>
<main>
  <h1 data-text="title"></h1>
  <p data-text="description"></p>
  <label class="file-picker"><span data-text="choose"></span>
    <input id="photos" class="file-input" type="file" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" multiple>
  </label>
  <p id="selection" aria-live="polite"></p>
  <small data-text="limits"></small>
  <button id="upload" type="button" disabled data-text="upload"></button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const messages = {
    ko: {
      title: '하객 사진 업로드', description: '소중한 순간을 함께 나눠주세요 ♡',
      choose: '사진 선택하기', empty: '선택된 사진이 없습니다.',
      limits: '한 번에 최대 10장 · 한 장당 10MB · JPG, PNG, HEIC', upload: '사진 업로드하기',
      selected: n => n + '장을 선택했습니다.', invalid: '사진을 최대 10장, 한 장당 10MB 이하로 선택해 주세요.',
      readingFailed: '사진을 읽지 못했습니다. 다시 선택해 주세요.',
      progress: (n,total) => n + ' / ' + total + '장 업로드 중…',
      done: n => n + '장 업로드 완료! 감사합니다 ♡',
      partial: n => n + '장 업로드 완료. ', retry: '남은 사진은 다시 업로드할 수 있습니다.', failed: '업로드에 실패했습니다. 잠시 후 다시 시도해 주세요.',
      errors: {
        PHOTO_PERIOD: '사진은 4월 17일부터 7일 동안 업로드할 수 있습니다.',
        PHOTO_INVALID: '사진 파일을 확인해 주세요. 한 장당 최대 10MB입니다.',
        PHOTO_SIZE: '한 장당 최대 10MB까지 가능합니다.', PHOTO_FORMAT: 'JPG, PNG, HEIC 사진만 업로드할 수 있습니다.',
        PHOTO_BUSY: '잠시 후 다시 시도해 주세요.', PHOTO_PREPARING: '사진 업로드를 준비 중입니다.', PHOTO_CLOSED: '사진 접수가 마감되었습니다.'
      }
    },
    ja: {
      title: 'ゲスト写真アップロード', description: '大切な瞬間を一緒に分かち合ってください ♡',
      choose: '写真を選択', empty: '写真が選択されていません。',
      limits: '1回につき最大10枚・1枚10MBまで・JPG, PNG, HEIC', upload: '写真をアップロード',
      selected: n => n + '枚の写真を選択しました。', invalid: '写真は最大10枚、1枚10MB以下で選択してください。',
      readingFailed: '写真を読み込めませんでした。もう一度選択してください。',
      progress: (n,total) => n + ' / ' + total + '枚をアップロード中…',
      done: n => n + '枚のアップロードが完了しました！ありがとうございます ♡',
      partial: n => n + '枚のアップロードが完了しました。', retry: '残りの写真は再度アップロードできます。', failed: 'アップロードに失敗しました。しばらくしてから再度お試しください。',
      errors: {
        PHOTO_PERIOD: '挙式当日（4月17日）から7日間、写真をアップロードできます。',
        PHOTO_INVALID: '写真ファイルをご確認ください。1枚10MBまでです。',
        PHOTO_SIZE: '1枚10MBまでアップロードできます。', PHOTO_FORMAT: 'JPG、PNG、HEIC形式の写真のみアップロードできます。',
        PHOTO_BUSY: 'しばらくしてから再度お試しください。', PHOTO_PREPARING: '写真のアップロードを準備中です。', PHOTO_CLOSED: '写真の受付は終了しました。'
      }
    }
  };
  const lang = document.documentElement.lang === 'ja' ? 'ja' : 'ko';
  const t = messages[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll('[data-text]').forEach(e => e.textContent = t[e.dataset.text]);
  const photos = document.getElementById('photos');
  const button = document.getElementById('upload');
  const status = document.getElementById('status');
  const selection = document.getElementById('selection');
  selection.textContent = t.empty;
  let queue = [];
  photos.addEventListener('change', () => {
    queue = Array.from(photos.files);
    const valid = queue.length > 0 && queue.length <= 10 && queue.every(f => f.size > 0 && f.size <= 10 * 1024 * 1024);
    button.disabled = !valid;
    selection.textContent = queue.length ? t.selected(queue.length) : t.empty;
    status.textContent = valid || !queue.length ? '' : t.invalid;
  });
  const readPhoto = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ base64: String(reader.result).split(',')[1] });
    reader.onerror = () => reject(new Error('PHOTO_READ'));
    reader.readAsDataURL(file);
  });
  const send = payload => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadPhoto(payload);
  });
  button.addEventListener('click', async () => {
    if (button.disabled) return;
    button.disabled = true;
    photos.disabled = true;
    let sent = 0;
    const total = queue.length;
    try {
      while (queue.length) {
        status.textContent = t.progress(sent + 1, total);
        await send(await readPhoto(queue[0]));
        queue.shift();
        sent++;
      }
      photos.value = '';
      selection.textContent = t.empty;
      status.textContent = t.done(total);
    } catch (error) {
      const code = String(error.message || '').match(/PHOTO_[A-Z_]+/);
      const message = code && code[0] === 'PHOTO_READ' ? t.readingFailed : code && t.errors[code[0]] || t.failed;
      status.textContent = t.partial(sent) + message + '\n' + t.retry;
    } finally {
      photos.disabled = false;
      button.disabled = queue.length === 0;
    }
  });
</script>
</body>
</html>
